  <title>PRX app icon concept - direction C: Verdict X</title>
  <desc>Direction C - Verdict X. The x of prx, built from a check and an interrupted counter-stroke: approve and request-changes overlap, and the gap where they would cross is the human's call. AI informs, you decide. Reads as a letter, a verdict, and a mark; system-blue squircle matches the app accent. 1024 grid, macOS squircle on the 824px content box.</desc>
