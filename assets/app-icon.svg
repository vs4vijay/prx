<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">PRX app icon: Verdict X</title>
  <desc id="desc">The x of prx, drawn as a check (approve) crossed by an interrupted counter-stroke (request changes). The gap where they would meet is the human's call: AI informs, you decide. White on the system-blue accent. 1024 grid: Apple continuous-corner squircle on the 824 px content box (100 px margin, corner radius 185.4), top-lit gradient, hairline edge, soft two-layer shadow. Master for 64 px and up; app-icon-32.svg and app-icon-16.svg are the pixel-hinted small sizes.</desc>
  <defs>
    <path id="sq" d="M 383.41 100 L 640.59 100 C 722.19 100 763 100 799.79 112.14 L 806.92 113.89 C 854.88 131.34 892.66 169.12 910.11 217.08 L 911.86 224.21 C 924 261 924 301.81 924 383.41 L 924 640.59 C 924 722.19 924 763 911.86 799.79 L 910.11 806.92 C 892.66 854.88 854.88 892.66 806.92 910.11 L 799.79 911.86 C 763 924 722.19 924 640.59 924 L 383.41 924 C 301.81 924 261 924 224.21 911.86 L 217.08 910.11 C 169.12 892.66 131.34 854.88 113.89 806.92 L 112.14 799.79 C 100 763 100 722.19 100 640.59 L 100 383.41 C 100 301.81 100 261 112.14 224.21 L 113.89 217.08 C 131.34 169.12 169.12 131.34 217.08 113.89 L 224.21 112.14 C 261 100 301.81 100 383.41 100 Z"/>
    <clipPath id="clip"><use href="#sq"/></clipPath>
    <linearGradient id="bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4C96FF"/>
      <stop offset="0.45" stop-color="#2F7BF5"/>
      <stop offset="1" stop-color="#1459CC"/>
    </linearGradient>
    <radialGradient id="sheen" cx="512" cy="40" r="640" gradientTransform="translate(512 40) scale(1.25 0.8) translate(-512 -40)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.18" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.75" stop-color="#001A4D" stop-opacity="0"/>
      <stop offset="1" stop-color="#001A4D" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="250" x2="0" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C0D9FF"/>
      <stop offset="1" stop-color="#9DBEF5"/>
    </linearGradient>
    <filter id="drop" x="-12%" y="-12%" width="124%" height="130%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="3" result="contact"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="14" result="ambient"/>
      <feComponentTransfer in="contact" result="c"><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feComponentTransfer in="ambient" result="a"><feFuncA type="linear" slope="0.26"/></feComponentTransfer>
      <feMerge><feMergeNode in="a"/><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#032A6B" flood-opacity="0.34"/>
    </filter>
  </defs>
  <use href="#sq" fill="url(#bg)" filter="url(#drop)"/>
  <use href="#sq" fill="url(#sheen)"/>
  <use href="#sq" fill="none" stroke="url(#edge)" stroke-width="5" clip-path="url(#clip)"/>
  <g filter="url(#lift)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="url(#counter)" stroke-width="76.02">
      <path d="M 312.44 317.3 L 455.6 460.46"/>
      <path d="M 611.44 616.3 L 695.27 700.13"/>
    </g>
    <path d="M 309.73 548.08 L 429.19 667.55 L 714.27 314.59" stroke="#FFFFFF" stroke-width="81.45"/>
  </g>
</svg>
