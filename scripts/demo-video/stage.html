<!doctype html>
<!-- The demo video's compositor: a 1920x1080 page whose every pixel is a pure
     function of time. render.py calls renderAt(t) and screenshots each frame.
     build.sh copies this file and stage.js next to manifest.js, ui/, term/ and
     brand/ in the build directory. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>prx demo stage</title>
<style>
  :root {
    --blue: #2F7BF5; --blue-hi: #4C96FF; --blue-lo: #1459CC;
    --bg: #0E0F12; --ink: #18181B; --text: #F4F4F5; --muted: #A1A1AA;
    --panel: #15161A;
    --sans: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Monaco, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: var(--sans); color: var(--text); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
    background:
      radial-gradient(ellipse 1100px 700px at 50% 42%, rgba(47, 123, 245, 0.16), rgba(47, 123, 245, 0) 70%),
      radial-gradient(ellipse 1700px 1000px at 50% 50%, #131a2a 0%, var(--bg) 72%); }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .hidden { display: none; }

  /* Captions: the narration. One at a time, above the content it describes. */
  .cap { position: absolute; left: 0; width: 1920px; text-align: center; opacity: 0;
    font-size: 50px; line-height: 60px; font-weight: 600; letter-spacing: -0.6px; color: var(--text); }
  .cap b { font-weight: 600; color: var(--blue-hi); }
  .cap code, .mono { font-family: var(--mono); letter-spacing: 0; }
  .cap code { font-size: 0.86em; color: var(--blue-hi); }

  /* The app window and the terminal share one presentation: a rounded panel,
     a hairline border and a soft shadow. No invented window chrome. */
  .panel { position: absolute; border-radius: 16px; overflow: hidden; background: var(--panel);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.10), 0 36px 90px rgba(0, 0, 0, 0.62), 0 0 140px rgba(47, 123, 245, 0.14); }
  .content { position: absolute; left: 0; top: 0; width: 1040px; height: 700px; transform-origin: 0 0; }
  .content img { position: absolute; left: 0; top: 0; display: block; }
  .pane { position: absolute; overflow: hidden; }
  #cursor { position: absolute; left: 0; top: 0; width: 17px; height: 23px; opacity: 0; transform-origin: 0 0;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.55)); }
  #ripple { position: absolute; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
    border: 2px solid rgba(124, 178, 255, 0.95); background: rgba(76, 150, 255, 0.22); opacity: 0; }
  /* The menu bar takes: a window onto the captured screen. Each take sits on
     its own full sheet of the capture's backdrop colour, so a take that is
     cropped tighter than the one before still covers it. */
  .panel.menu, .take { background: #1C1C1C; }
  .canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .take { position: absolute; left: 0; top: 0; width: 2600px; height: 1400px; }
  .take img { position: absolute; display: block; }
  .term { padding: 34px 40px; }
  .term .screen { position: relative; }
  .term img { position: absolute; left: 0; top: 0; display: block; }

  /* Title cards */
  .centre { position: absolute; left: 0; width: 1920px; text-align: center; }
  #open-logo { position: absolute; left: 460px; top: 300px; width: 1000px; }
  #open-sub { top: 760px; font-size: 40px; line-height: 50px; color: var(--muted); font-weight: 500; letter-spacing: -0.2px; }
  .big { font-size: 78px; line-height: 94px; font-weight: 650; letter-spacing: -1.6px; }
  .big b { color: var(--blue-hi); font-weight: 650; }
  .kicker { font-size: 30px; line-height: 38px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--blue-hi); }

  #trust .cards { position: absolute; left: 150px; top: 480px; width: 1620px; display: flex; gap: 36px; }
  .card { flex: 1; height: 400px; border-radius: 22px; padding: 44px 44px 0; background: rgba(255, 255, 255, 0.045);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.10); opacity: 0; }
  .card .n { font-family: var(--mono); font-size: 26px; color: var(--blue-hi); }
  .card h3 { margin-top: 18px; font-size: 52px; line-height: 60px; font-weight: 650; letter-spacing: -1px; }
  .card p { margin-top: 20px; font-size: 32px; line-height: 44px; color: var(--muted); font-weight: 450; }
  .card p code { font-family: var(--mono); font-size: 28px; color: var(--text); }
  .card.you { background: linear-gradient(180deg, rgba(76, 150, 255, 0.26), rgba(20, 89, 204, 0.20)); box-shadow: inset 0 0 0 1px rgba(124, 178, 255, 0.55); }
  .card.you p { color: #D4D4D8; }

  #end-logo { position: absolute; left: 610px; top: 120px; width: 700px; }
  #end-code { position: absolute; left: 460px; top: 500px; width: 1000px; border-radius: 16px; padding: 34px 44px; background: var(--panel);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.10), 0 30px 80px rgba(0, 0, 0, 0.5);
    font-family: var(--mono); font-size: 32px; line-height: 52px; white-space: pre; opacity: 0; }
  #end-code i { font-style: normal; color: var(--blue-hi); }
  #end-url { top: 762px; font-size: 62px; line-height: 74px; font-weight: 650; letter-spacing: -1px; }
  #end-url b { color: var(--blue-hi); font-weight: 650; }
  #end-meta { top: 868px; font-size: 30px; line-height: 40px; color: var(--muted); font-weight: 500; }

  /* Poster (render.py --poster): its own static layout. */
  #poster-logo { position: absolute; left: 110px; top: 120px; width: 560px; }
  #poster h1 { position: absolute; left: 116px; top: 430px; width: 860px; font-size: 92px; line-height: 106px; font-weight: 700; letter-spacing: -2px; }
  #poster h1 b { color: var(--blue-hi); font-weight: 700; }
  #poster p { position: absolute; left: 118px; top: 676px; width: 800px; font-size: 36px; line-height: 50px; color: var(--muted); font-weight: 500; }
  #poster .url { position: absolute; left: 118px; top: 840px; font-family: var(--mono); font-size: 32px; color: var(--text);
    padding: 16px 28px; border-radius: 14px; background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14); }
  #poster .panel { left: 990px; top: 150px; width: 1144px; height: 770px; }
  #poster .panel img { width: 1144px; height: 770px; display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="manifest.js"></script>
<script src="stage.js"></script>
</body>
</html>
